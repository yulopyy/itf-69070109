<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodPicker ITF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1016;
    --nav: #161a26;
    --surface: #1b2030;
    --ink: #eceae6;
    --muted: #9aa0b2;
    --accent: #ffb547;
    --accent-dark: #c4841a;
    --accent-ink: #1a1305;
    --chip: #3a2d12;
    --line: #2a3045;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: radial-gradient(circle at 50% -10%, #1c2238 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
  }
  /* Navbar */
  .navbar {
    position: sticky; top: 0; z-index: 10;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 16px 28px;
    background: var(--nav);
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-size: 14px;
  }
  .navbar .brand { font-family: 'Mitr', sans-serif; font-size: 20px; letter-spacing: .5px; color: var(--accent); }
  .navbar .week { text-align: right; color: var(--muted); }

  main { display: flex; flex-direction: column; align-items: center; padding: 48px 20px; gap: 22px; }
  h1 { font-family: 'Mitr', sans-serif; font-weight: 500; font-size: 28px; text-align: center; }
  .sub { color: var(--muted); margin-top: -14px; }

  .card {
    width: min(360px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
  }
  .photo {
    width: 100%; aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: #11141f;
    display: grid; place-items: center;
    font-size: 96px;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-family: 'Mitr', sans-serif; font-weight: 500; font-size: 26px; color: var(--accent); margin-top: 16px; }
  .desc { color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .price {
    display: inline-block; margin-top: 12px;
    padding: 5px 16px; border-radius: 999px;
    background: var(--chip); color: var(--accent); font-weight: 600;
  }
  .card.pop { animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.96); opacity: .5; } to { transform: scale(1); opacity: 1; } }

  .btn {
    width: min(360px, 100%);
    border: 0; cursor: pointer;
    padding: 14px;
    border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font: 500 18px 'Mitr', sans-serif;
    box-shadow: 0 5px 0 var(--accent-dark);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:hover { background: #ffc46b; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .card.pop { animation: none; } }
</style>
</head>
<body>

<nav class="navbar">
  <span>69070109</span>
  <span class="brand">FOODPICKER ITF</span>
  <span class="week">Week15</span>
</nav>

<main>
  <h1>วันนี้กินอะไรดี?</h1>
  <p class="sub">กดปุ่มด้านล่างเพื่อสุ่มเมนู</p>

  <section class="card" id="card" aria-live="polite">
    <div class="photo" id="photo"></div>
    <div class="name" id="name"></div>
    <p class="desc" id="desc"></p>
    <span class="price" id="price"></span>
  </section>

  <button class="btn" id="randomBtn">สุ่มเมนูอาหาร</button>
</main>

<script>
  // image: ใส่ลิงก์รูป หรือพาธไฟล์ในโปรเจกต์ เช่น "images/sushi.jpg"
  // ถ้าโหลดรูปไม่ได้ จะแสดง emoji แทนอัตโนมัติ
  const foods = [
    { name: "ซูชิ",        desc: "ข้าวญี่ปุ่นปั้นหน้าแซลมอนสดเนื้อนุ่ม เสิร์ฟพร้อมวาซาบิและขิงดอง",   price: "120-250 บาท", emoji: "🍣", image: "" },
    { name: "พิซซ่า",   desc: "แป้งบางกรอบ ซอสมะเขือเทศ โมซซาเรลลาละลาย โรยใบโหระพาอิตาเลียน", price: "180-320 บาท", emoji: "🍕", image: "" },
    { name: "ทาโก้",    desc: "แผ่นแป้งข้าวโพดห่อหมูหมักพริกและสับปะรด บีบมะนาวก่อนกิน",         price: "90-160 บาท",  emoji: "🌮", image: "" },
    { name: "บิบิมบับ",          desc: "ข้าวร้อนในชามหิน ผักหลากสี เนื้อ ไข่ดาว คลุกกับซอสโคชูจัง",       price: "150-230 บาท", emoji: "🥘", image: "" },
    { name: "ฟิชแอนด์ชิปส์",     desc: "ปลาชุบแป้งทอดกรอบ เคียงเฟรนช์ฟรายส์และซอสทาร์ทาร์",              price: "200-300 บาท", emoji: "🐟", image: "" },
    { name: "บัตเตอร์ชิกเกน", desc: "แกงไก่ซอสมะเขือเทศครีมเนยหอมมัน กินคู่แป้งนานอบร้อนๆ",            price: "160-260 บาท", emoji: "🍛", image: "" },
    { name: "เบอร์เกอร์",      desc: "เนื้อบดย่างฉ่ำ ชีสเชดดาร์ ผักสด ในขนมปังบริออช",                  price: "150-280 บาท", emoji: "🍔", image: "" }
  ];

  const $ = id => document.getElementById(id);
  let last = -1;

  function render(food) {
    const photo = $("photo");
    photo.textContent = "";
    if (food.image) {
      const img = new Image();
      img.alt = food.name;
      img.onerror = () => { photo.textContent = food.emoji; };
      img.src = food.image;
      photo.appendChild(img);
    } else {
      photo.textContent = food.emoji;
    }
    $("name").textContent = food.name;
    $("desc").textContent = food.desc;
    $("price").textContent = "ราคา " + food.price;

    const card = $("card");
    card.classList.remove("pop");
    void card.offsetWidth;
    card.classList.add("pop");
  }

  function pickRandom() {
    let i;
    do { i = Math.floor(Math.random() * foods.length); } while (i === last);
    last = i;
    render(foods[i]);
  }

  $("randomBtn").addEventListener("click", pickRandom);
  pickRandom();
</script>
</body>
</html>
